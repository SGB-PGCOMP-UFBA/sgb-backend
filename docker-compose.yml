services:
  db:
    image: postgres:17
    container_name: sgb-api-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgb_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mynetwork
    restart: always

  # Ambiente e2e local, igual ao que o GitHub Actions do front sobe no job.
  # Só sobe com `docker compose --profile e2e up -d`. O banco é descartável
  # (tmpfs) e o Mailpit recebe os e-mails sem entregar a ninguém.
  db-e2e:
    image: postgres:17
    container_name: sgb-api-database-e2e
    profiles: ["e2e"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgb_e2e
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5434:5432"

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: sgb-mailpit
    profiles: ["e2e"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:

networks:
  mynetwork:
    driver: bridge
